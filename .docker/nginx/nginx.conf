# nginx runs as the unprivileged www-data user, so it only writes to /tmp and stdout/stderr
daemon off;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    access_log /dev/stdout;

    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /var/www/html;

        location / {
            deny all;
        }

        location = / {
            allow all;
            index index.php;
        }

        location ~ ^/index.php$ {
            allow all;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        location ~ ^/(favicon.ico|icon.png|icon\-144.png|icon\-512.png)$ {
            allow all;
        }

        location ~ ^/(manifest.json|js/navigator.js|css/style.css)$ {
            allow all;
        }

        location ~ ^/vendor/twbs/bootstrap/dist/css/bootstrap.min.(css|css.map)$ {
            allow all;
        }
    }
}
