# IPv6 override, use together with the main compose file:
# docker compose -f docker-compose.yml -f .docker/docker-compose.ipv6.yml up -d --build
services:
  ipp:
    ports:
      - '[::1]:8080:8080'
    networks:
      net6:
        ipv6_address: fd16:279c:f6ef::10
    dns: fd16:279c:f6ef::1
networks:
  net6:
    enable_ipv6: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: fd16:279c:f6ef::/48
          gateway: fd16:279c:f6ef::1
