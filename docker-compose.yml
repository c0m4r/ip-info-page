services:
  ipp:
    build: .
    image: ip-info-page:local
    ports:
      - '127.0.0.1:8080:8080'
    # Optional GeoLite2 City database, see README.md
    # volumes:
    #   - ./GeoLite2-City.mmdb:/var/www/html/GeoLite2-City.mmdb:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
